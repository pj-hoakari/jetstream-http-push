services:
    nats:
        image: nats:2-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
        command: ["-js", "-m", "8222"]
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
            interval: 5s
            timeout: 5s
            retries: 10

    relay:
        build:
            context: .
        environment:
            NATS_URL: nats://nats:4222
            NAK_DELAY: 200ms
            SUBSCRIPTIONS_FILE: /etc/jetstream-http-push/subscriptions.json
        volumes:
            - ./e2e/subscriptions.json:/etc/jetstream-http-push/subscriptions.json:ro
        depends_on:
            nats:
                condition: service_healthy
            seed:
                condition: service_completed_successfully

    seed:
        build:
            context: .
            target: e2e
        entrypoint: ["go", "run", "-tags", "e2e", "./e2e/seed"]
        depends_on:
            nats:
                condition: service_healthy

    e2e:
        profiles: [e2e]
        build:
            context: .
            target: e2e
        depends_on:
            relay:
                condition: service_started
