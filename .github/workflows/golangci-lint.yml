name: autofix.ci

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    golangci-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: changes
              uses: pj-hoakari/actions/detect-changes@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
              with:
                  paths: |
                      **/*.go
                      .golangci.yml
                      go.mod
                      go.sum
                      mise.toml
                      .github/workflows/golangci-lint.yml

            - name: Set up Go
              if: steps.changes.outputs.changed == 'true'
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              if: steps.changes.outputs.changed == 'true'
              uses: pj-hoakari/actions/go/lint@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
