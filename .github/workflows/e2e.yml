name: E2E

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: changes
              uses: pj-hoakari/actions/detect-changes@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  paths: |
                      **/*.go
                      go.mod
                      go.sum
                      Dockerfile
                      compose.yaml
                      e2e/**
                      .github/workflows/e2e.yml

            - name: Run the end-to-end tests
              id: up
              if: steps.changes.outputs.changed == 'true'
              run: docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e

            - name: Dump service logs
              if: failure() && (steps.up.outcome == 'success' || steps.up.outcome == 'failure')
              run: docker compose --profile e2e logs --no-color

            - name: Stop services
              if: always() && (steps.up.outcome == 'success' || steps.up.outcome == 'failure')
              run: docker compose --profile e2e down -v
